# Serves the built React SPA and proxies API calls to the backend
# container — mirrors exactly what vite.config.js's dev-server `proxy`
# block does for `npm run dev`, so the frontend code itself (relative
# fetch("/api/...") calls) needs zero changes between dev and Docker.
#
# `backend` below resolves via Docker's embedded DNS to whatever container
# is running the `backend` service in docker-compose.yml — not a hardcoded
# IP, which is what lets that container be rebuilt/restarted independently
# without ever touching this file.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing): any path nginx can't find as a
    # real file falls back to index.html, and the app's own router decides
    # what to render. Without this, refreshing the browser on e.g. /predict
    # would 404 at the nginx level before React ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document/media uploads can be large; match backend's own
        # MAX_UPLOAD_SIZE_MB default (100MB) rather than nginx's 1MB default,
        # which would otherwise reject uploads with a 413 before the
        # backend's own size check ever runs.
        client_max_body_size 100M;
    }

    # Swagger UI and its schema — linked from the navbar user menu (see
    # vite.config.js's dev-proxy comment making the same point). Only
    # actually served by the backend when DEBUG=true (see app/main.py).
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
