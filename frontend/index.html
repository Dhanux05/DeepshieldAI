<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DeepShieldAI — explainable, multimodal deepfake detection and digital content authenticity verification."
    />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <script>
      // Set the theme attribute before first paint so there is no flash of
      // the wrong theme — mirrors src/hooks/useTheme.jsx's own resolution
      // order (saved choice > OS preference > dark default), duplicated
      // here only because this has to run before React (and that hook)
      // ever mounts.
      (function () {
        try {
          var saved = localStorage.getItem("deepshield-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='%230a0618'/%3E%3Cpath d='M12 4.2l6 2.2v4.4c0 4.1-2.6 7.6-6 8.9-3.4-1.3-6-4.8-6-8.9V6.4l6-2.2z' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <title>DeepShieldAI — Multimodal Deepfake Detection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
